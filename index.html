<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathMaster • KPSEA Past Papers</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0f172a;color:white}
.header{background:linear-gradient(135deg,#1e40af,#0f172a);padding:20px 20px 24px;text-align:center;border-radius:0 0 24px 24px}
.logo{font-size:30px;font-weight:800}.logo span{color:#60a5fa}
.sub{opacity:.8;font-size:11px;margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0}
.tab{padding:10px 18px;border-radius:20px;background:rgba(255,255,255,.1);font-size:13px;font-weight:700;cursor:pointer}
.tab.active{background:white;color:#0f172a}
.container{padding:12px;max-width:540px;margin:0 auto}
.card{background:white;color:#0f172a;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.label{font-size:10px;font-weight:800;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
input,select{width:100%;padding:14px;border-radius:10px;border:2px solid #e2e8f0;background:#f8fafc;font-size:14px;font-weight:600}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:white;border:none;border-radius:10px;font-weight:800;margin-top:8px}
.result{background:#0f172a;color:white;border-radius:12px;padding:14px;margin-top:10px}
.ans{font-size:18px;font-weight:800;color:#60a5fa}
.paper{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:8px 0;background:#f8fafc}
.paper b{font-size:12px;color:#1e40af}.paper p{font-size:13px;margin:6px 0;font-weight:600}
.paper button{padding:6px 12px;background:#0f172a;color:white;border:none;border-radius:6px;font-size:11px}
.badge{font-size:9px;background:#dbeafe;color:#1e40af;padding:3px 7px;border-radius:10px}
.footer{text-align:center;padding:14px;font-size:10px;opacity:.5}
</style>
</head>
<body>
<div class="header">
<div class="logo">Math<span>Master</span> PRO</div>
<div class="sub">CBC • KPSEA Past Papers • Senior School</div>
<div class="tabs">
<div class="tab active" id="t1" onclick="showTab(1)">⚡ Solver</div>
<div class="tab" id="t2" onclick="showTab(2)">📚 KPSEA Papers</div>
</div>
</div>
<div class="container">
<div id="tab1">
<div class="card">
<div class="label">KPSEA Solver - Senior School</div>
<input id="q" placeholder="e.g. x^2 -5x+6=0">
<button class="btn" onclick="solve()">SOLVE • KPSEA MODE</button>
<div class="result" id="result"><div style="opacity:.6;font-size:11px">READY • OFFLINE</div><div style="margin-top:6px;font-size:13px">Type any question. Works offline.</div></div>
</div>
</div>
<div id="tab2" style="display:none">
<div class="card">
<div class="label">Filter Past Papers</div>
<select id="filter" onchange="renderPapers()">
<option value="all">All - KPSEA 2023-2025</option>
<option value="Grade 6">Grade 6 KPSEA</option>
<option value="Grade 10">Grade 10</option>
<option value="Grade 11">Grade 11</option>
<option value="Grade 12">Grade 12 Senior</option>
<option value="Algebra">Algebra</option>
</select>
<div id="papers"></div>
</div>
</div>
<div class="footer">Built by Mourice Otieno • Nairobi • 2026<br>KPSEA • CBC • v4.0 Past Papers</div>
</div>
<script>
const kpseaPapers=[
{g:'Grade 6',t:'Numbers',q:'A school has 1,245 pupils. 478 are boys. How many girls?',a:'767 girls',y:'2024'},
{g:'Grade 6',t:'Fractions',q:'What is 3/4 + 2/3 ?',a:'1 5/12 (17/12)',y:'2023'},
{g:'Grade 6',t:'Geometry',q:'Area of rectangle length 12m width 8m?',a:'96 m²',y:'2024'},
{g:'Grade 6',t:'Rate',q:'A car travels 180km in 3 hours. Speed?',a:'60 km/h',y:'2023'},
{g:'Grade 10',t:'Algebra',q:'Solve: 2x + 5 = 15',a:'x = 5',y:'2024'},
{g:'Grade 10',t:'Algebra',q:'Factorize: x² -5x +6 =0',a:'(x-2)(x-3), x=2,3',y:'2023'},
{g:'Grade 11',t:'Trigonometry',q:'Find sin 30° + cos 60°',a:'1 (0.5+0.5)',y:'2024'},
{g:'Grade 11',t:'Statistics',q:'Mean of 4,6,8,10,12?',a:'8',y:'2024'},
{g:'Grade 12',t:'Calculus',q:'dy/dx of y = 3x² + 2x -5',a:'6x +2',y:'2025 Senior'},
{g:'Grade 12',t:'Linear',q:'Solve simultaneous: x+y=10, x-y=4',a:'x=7, y=3',y:'2025 Senior'},
];
function showTab(n){
 document.getElementById('tab1').style.display=n==1?'block':'none';
 document.getElementById('tab2').style.display=n==2?'block':'none';
 document.getElementById('t1').classList.toggle('active',n==1);
 document.getElementById('t2').classList.toggle('active',n==2);
 if(n==2)renderPapers();
}
function renderPapers(){
 let f=document.getElementById('filter').value;
 let c=document.getElementById('papers'); c.innerHTML='';
 kpseaPapers.filter(p=>f=='all'||p.g==f||p.t==f).forEach(p=>{
   c.innerHTML+=`<div class=paper><b><span class=badge>${p.g}</span> ${p.t} • ${p.y}</b><p>${p.q}</p><button onclick="this.nextElementSibling.style.display='block';this.style.display='none'">Show Answer</button><div style=display:none><div class=ans style=font-size:14px;color:#0f172a>✅ ${p.a}</div><small>Competency: ${p.t} - CBC</small></div></div>`;
 });
}
function solve(){
 let v=document.getElementById('q').value.trim(); let r=document.getElementById('result');
 if(!v){r.innerHTML='Type question!';return;}
 let quad=v.match(/([-\d]*)x\^2\s*([+-])\s*(\d+)x\s*([+-])\s*(\d+)\s*=\s*0/i);
 if(quad){let a=parseInt(quad[1]||'1')||1;if(quad[1]=='-')a=-1;let b=parseInt(quad[2]+quad[3]);let c=parseInt(quad[4]+quad[5]);let D=b*b-4*a*c;if(D>=0){let x1=(-b+Math.sqrt(D))/(2*a);let x2=(-b-Math.sqrt(D))/(2*a);r.innerHTML=`<div class=ans>x=${x1.toFixed(2)}, ${x2.toFixed(2)}</div><div style=font-size:12px;opacity:.8;margin-top:6px>D=${D} • KPSEA Algebra</div>`;return;}}
 try{let clean=v.replace(/[^0-9+\-*/().^% ]/g,'').replace(/\^/g,'**').replace(/%/g,'/100*');if(clean){let ans=eval(clean);r.innerHTML=`<div class=ans>${ans}</div><div style=font-size:11px;opacity:.7;margin-top:4px>Q:${v} • KPSEA Pathway</div>`;return;}}catch(e){}
 r.innerHTML=`<div style=font-size:14px>${v}</div><div style=font-size:11px;opacity:.7>Check Past Papers tab for similar.</div>`;
}
renderPapers();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
