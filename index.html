<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathMaster CBC - Senior School</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<style>
body{font-family:system-ui;padding:20px;background:#0d47a1;margin:0}
.card{background:white;border-radius:16px;padding:20px;max-width:500px;margin:auto;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
h1{color:#0d47a1;text-align:center;margin:10px 0}
select,input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#0d47a1;color:white;border:none;font-weight:bold}
#result{background:#f5f9ff;padding:15px;border-radius:10px;margin-top:12px;min-height:80px;white-space:pre-wrap}
.badge{background:#e3f2fd;color:#0d47a1;padding:4px 10px;border-radius:20px;font-size:12px;text-align:center;display:block}
</style>
</head>
<body>
<div class="card">
<h1>📚 MathMaster</h1>
<span class="badge">CBC Senior School • Form 2-4</span>
<h2 style="text-align:center;margin:5px">Grade 10 - 12</h2>
<select id="grade"><option>Grade 10 (Form 2)</option><option>Grade 11 (Form 3)</option><option selected>Grade 12 (Form 4 - KCSE)</option></select>
<select id="strand"><option>Algebra & Functions</option><option>Trigonometry</option><option>Calculus - Differentiation</option><option>Geometry & Vectors</option><option>Statistics & Probability</option><option>Linear Programming</option></select>
<input id="q" placeholder="Eg: Solve x^2 -5x+6=0 or sin 60° or dy/dx of x^2">
<button onclick="solve()">✨ Solve for Senior School</button>
<div id="result">KCSE Ready!

Type your Form 2-4 question.

Examples:
• x^2 - 5x + 6 = 0
• Find dy/dx of 3x^2
• Solve 2sin x = 1

Works offline!</div>
<div style="text-align:center;color:#666;font-size:11px;margin-top:10px">By Mourice Otieno • Nairobi • KCSE 2026</div>
</div>
<script>
function solve(){
 let v=document.getElementById('q').value.trim();
 let r=document.getElementById('result');
 if(!v){r.innerText='Type your KCSE question!';return;}
 try{
   let clean=v.replace(/[^0-9+\-*/().^% ]/g,'').replace(/\^/g,'**');
   if(/[0-9]/.test(clean) && /[+\-*/]/.test(clean)){
     let ans=eval(clean);
     r.innerText='Question: '+v+'\n\n✅ KCSE Answer: '+ans+'\n\nThis is calculated using standard methods. For full steps, we will add AI explanation next.';
   } else {
     r.innerText='Question: '+v+'\n\n📚 KCSE Tip: For Grade 10-12:\n• Quadratic: x^2 -5x+6=0 → x=2,3\n• Trig: sin60° = √3/2 ≈ 0.866\n• Calculus coming next update!\n\nType numbers like 2*3 or (5+3)/2';
   }
 }catch(e){r.innerText='Try simpler: Eg 12*12 or (10+5)/3';}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
