<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathMaster CBC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<style>
body{font-family:system-ui;padding:20px;background:#f5f7ff;margin:0}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.1);max-width:500px;margin:auto}
h1{color:#0d47a1;text-align:center}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#0d47a1;color:white;font-size:18px;margin-top:10px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;font-size:18px;box-sizing:border-box}
.result{margin-top:15px;font-size:20px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>MathMaster CBC</h1>
<p style="text-align:center">Grade 4-6 CBC</p>
<input id="q" placeholder="e.g. 25 x 4">
<button onclick="solve()">Solve</button>
<div id="ans" class="result"></div>
<button onclick="installApp()" id="installBtn" style="background:#2e7d32;display:none">Install App</button>
</div>
<script>
function solve(){
 let v=document.getElementById('q').value;
 try{
  let r=eval(v.replace('x','*').replace('X','*'));
  document.getElementById('ans').innerText='Answer: '+r;
 }catch{ document.getElementById('ans').innerText='Try: 12+8'; }
}
let p;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();p=e;document.getElementById('installBtn').style.display='block';});
function installApp(){ if(p){p.prompt();} }
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
